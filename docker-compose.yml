name: twapza

x-backend: &backend
  build: ./backend
  image: twapza-backend
  env_file:
    - path: .env
      required: false
  environment:
    REDIS_URL: redis://twapza-redis:6379/0
    TWAPZA_STORAGE_ROOT: /data/storage
    TWAPZA_DATABASE_URL: sqlite:////data/twapza.db
    TWAPZA_WHISPER_MODEL_DIR: /data/models
  volumes:
    - twapza-data:/data
  depends_on:
    twapza-redis:
      condition: service_healthy
  restart: unless-stopped

services:
  twapza-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  twapza-api:
    <<: *backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  twapza-worker:
    <<: *backend
    command: ["python", "-m", "twapza.workers"]

  twapza-scheduler:
    <<: *backend
    command: ["python", "-m", "twapza.cleanup"]

  twapza-web:
    build: ./frontend
    image: twapza-web
    ports:
      - "8080:80"
    depends_on:
      - twapza-api
    restart: unless-stopped

volumes:
  twapza-data:
