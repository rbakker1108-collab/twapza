server {
    listen 80;
    root /usr/share/nginx/html;

    # Upload chunks are 16 MB by default; leave headroom.
    client_max_body_size 64m;

    # Look the API up through Docker's DNS on every request (cached 10 s) instead of once at
    # startup: when twapza-api is rebuilt or restarted it can get a new IP, and a cached one
    # makes every request fail with 502 until this container restarts too.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $twapza_api http://twapza-api:8000;
        proxy_pass $twapza_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Stream request bodies and SSE responses instead of buffering them.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
